{{- if .Values.openshift.enabled -}}
---
# Grant the operator's service account permission to use the anyuid SCC.
# Required because the operator image (distroless nonroot) runs as UID 65534,
# which falls outside the UID range OpenShift assigns to user namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
---
# Grant the operator's service account access to the OpenShift alertmanager API.
# The kube-rbac-proxy in front of the alertmanager performs a SubjectAccessReview
# checking for alertmanagers/api access in the alertmanager's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-alertmanager-access
  namespace: {{ .Values.openshift.alertmanagerNamespace }}
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - alertmanagers/api
    resourceNames:
      - {{ .Values.openshift.alertmanagerName }}
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-alertmanager-access
  namespace: {{ .Values.openshift.alertmanagerNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "silence-operator.name" . }}-alertmanager-access
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
{{- end -}}
