{{- if .Values.openshift.enabled -}}
---
# Grant the operator's service account permission to use the nonroot-v2 SCC (OCP 4.11+).
# nonroot-v2 allows any fixed non-root UID (including 65534 used by this image) without
# requiring anyuid, and supports seccompProfile unlike anyuid.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
---
# Bind the operator's service account to CMO's pre-existing monitoring-alertmanager-edit Role.
# The kube-rbac-proxy in front of the alertmanager performs a SubjectAccessReview against
# alertmanagers/api in the alertmanager's namespace; CMO ships this Role for exactly that purpose.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-alertmanager-access
  namespace: {{ .Values.openshift.alertmanagerNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-alertmanager-edit
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
{{- if .Values.openshift.injectServiceCA }}
---
# OpenShift injects the cluster service CA into this ConfigMap automatically.
# The operator mounts it to verify the kube-rbac-proxy TLS certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ .Values.openshift.caConfigMapName }}
  namespace: {{ template "silence-operator.namespace" . }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
{{- end }}
{{- end -}}
