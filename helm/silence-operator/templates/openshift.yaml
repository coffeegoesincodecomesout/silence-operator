{{- if .Values.openshift.enabled -}}
---
# Grant the operator's service account permission to use the anyuid SCC.
# Required because the operator image (distroless nonroot) runs as UID 65534,
# which falls outside the UID range OpenShift assigns to user namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
---
# Bind the operator's service account to CMO's pre-existing monitoring-alertmanager-edit Role.
# The kube-rbac-proxy in front of the alertmanager performs a SubjectAccessReview against
# alertmanagers/api in the alertmanager's namespace; CMO ships this Role for exactly that purpose.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: {{ template "silence-operator.name" . }}-alertmanager-access
  namespace: {{ .Values.openshift.alertmanagerNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-alertmanager-edit
subjects:
  - kind: ServiceAccount
    name: {{ template "silence-operator.name" . }}
    namespace: {{ template "silence-operator.namespace" . }}
{{- end -}}
